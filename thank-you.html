<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Update | GreenLeaf Pest Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thank-you-container {
            text-align: center;
            padding: 80px 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .warning-icon {
            color: #f39c12;
        }
        .error-icon {
            color: #dc3545;
        }
        .thank-you-container h1 {
            color: #333;
            margin-bottom: 15px;
        }
        .thank-you-container p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            margin: 8px 0;
        }
        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .home-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<main>
    <div class="thank-you-container">
        <div id="statusIcon" class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 id="statusTitle">Request Submitted!</h1>
        <p id="statusMessagePrimary">Thank you for choosing <strong>GreenLeaf Pest Control</strong>.</p>
        <p id="statusMessageSecondary">We've sent a verification link to your email. Please click it within 3 days to confirm your booking.</p>

        <a href="index.html" class="home-button">Return to Homepage</a>
    </div>
</main>

<footer class="footer">
    <div class="footer-bottom">
        <p>&copy; 2026 GreenLeaf Pest Control. All rights reserved.</p>
    </div>
</footer>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const status = (params.get('status') || 'verification-sent').trim();

  const icon = document.getElementById('statusIcon');
  const title = document.getElementById('statusTitle');
  const primary = document.getElementById('statusMessagePrimary');
  const secondary = document.getElementById('statusMessageSecondary');

  const views = {
    'verification-sent': {
      icon: 'fas fa-paper-plane',
      iconClass: 'warning-icon',
      title: 'Verification Link Sent',
      primary: 'Thank you for choosing GreenLeaf Pest Control.',
      secondary: 'Please check your inbox and click the verification link within 3 days to confirm your booking.'
    },
    'verified': {
      icon: 'fas fa-check-circle',
      iconClass: '',
      title: 'Booking Confirmed!',
      primary: 'Your booking has been verified successfully.',
      secondary: 'A confirmation email has been sent, and your details have been recorded.'
    },
    'already-verified': {
      icon: 'fas fa-check-double',
      iconClass: '',
      title: 'Booking Already Confirmed',
      primary: 'This booking was already verified earlier.',
      secondary: 'No further action is needed.'
    },
    'verification-error': {
      icon: 'fas fa-times-circle',
      iconClass: 'error-icon',
      title: 'Verification Failed',
      primary: 'We could not verify this booking link.',
      secondary: 'The link may be expired or invalid. Please submit a new booking request.'
    }
  };

  const view = views[status] || views['verification-sent'];
  icon.innerHTML = `<i class="${view.icon}"></i>`;
  icon.className = `success-icon ${view.iconClass}`.trim();
  title.textContent = view.title;
  primary.textContent = view.primary;
  secondary.textContent = view.secondary;
})();
</script>

</body>
</html>
