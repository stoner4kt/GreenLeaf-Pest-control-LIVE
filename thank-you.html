<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed | GreenLeaf Pest Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thank-you-container {
            text-align: center;
            padding: 80px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .thank-you-container h1 {
            color: #333;
            margin-bottom: 15px;
        }
        .thank-you-container p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
        }
        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #28a745; /* Adjust to match your GreenLeaf primary color */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .home-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<main>
    <div class="thank-you-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Request Submitted!</h1>
        <p>Thank you for choosing <strong>GreenLeaf Pest Control</strong>.</p>
        <p>We have received your booking details and our team will contact you within 24 hours to confirm your appointment for the requested date.</p>
        
        <a href="index.html" class="home-button">Return to Homepage</a>
    </div>
</main>

<footer class="footer">
    <div class="footer-bottom">
        <p>&copy; 2026 GreenLeaf Pest Control. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
